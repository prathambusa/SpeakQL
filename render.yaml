services:
  - type: web
    name: speakql-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: EMBEDDING_PROVIDER
        value: local
      - key: DB_ALIASES
        value: chinook,financial,superstore
      - key: DB_CHINOOK_URL
        value: sqlite+aiosqlite:////data/chinook.db
      - key: DB_FINANCIAL_URL
        value: sqlite+aiosqlite:////data/financial.db
      - key: DB_SUPERSTORE_URL
        value: sqlite+aiosqlite:////data/superstore.db
      - key: CHROMA_MODE
        value: local
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_data
      - key: TOP_K_TABLES
        value: "5"
      - key: MAX_ROWS
        value: "1000"
      - key: QUERY_TIMEOUT_SECONDS
        value: "30"
