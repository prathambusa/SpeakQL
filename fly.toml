# Change "speakql-backend" to a globally unique name, then run:
#   fly launch --no-deploy   (first time — links repo to Fly app)
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly deploy
app = "speakql-backend"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  LLM_PROVIDER = "anthropic"
  CLAUDE_MODEL = "claude-sonnet-4-5"
  EMBEDDING_PROVIDER = "local"
  DB_ALIASES = "chinook,financial,superstore"
  DB_CHINOOK_URL = "sqlite+aiosqlite:////data/chinook.db"
  DB_FINANCIAL_URL = "sqlite+aiosqlite:////data/financial.db"
  DB_SUPERSTORE_URL = "sqlite+aiosqlite:////data/superstore.db"
  CHROMA_MODE = "local"
  CHROMA_PERSIST_DIR = "/app/chroma_data"
  TOP_K_TABLES = "5"
  MAX_ROWS = "1000"
  QUERY_TIMEOUT_SECONDS = "30"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
